<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" role="img" aria-labelledby="title description">
  <title id="title">Linky87 87-key VIA layout with Layer 1 functions</title>
  <desc id="description">An 87-key ANSI TKL keyboard diagram. Small labels show Layer 1 functions. Pink keys use Super shortcuts; blue is the layer key.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; }
    .key rect { fill: #252b36; stroke: #667085; stroke-width: 1.5; rx: 5; }
    .key .base { fill: #f3f4f6; font-size: 13px; font-weight: 600; }
    .key .fn { fill: #aab4c3; font-size: 8px; }
    .key.wide rect { fill: #333b49; }
    .key.layer rect { fill: #234865; stroke: #75c9ff; stroke-width: 2; }
    .key.layer .fn { fill: #c9edff; font-weight: 700; }
    .legend { fill: gold; font-weight="bolder"; font-size: 20px; }
  </style>
